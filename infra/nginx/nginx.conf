worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 256;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;

    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;

    # Resolve the Compose service again when the app container is replaced.
    resolver 127.0.0.11 valid=10s ipv6=off;
    upstream messaging_api {
        zone messaging_api 64k;
        server app:3000 resolve;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;

        # Request errors can include the original URL and query string.
        error_log /dev/null;

        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;

        location = /health {
            proxy_pass http://messaging_api/health;
        }

        location ~* ^/(healthz|readyz|metrics)(/|$) {
            return 404;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
